<!doctype html><html lang="en"><meta charset="utf-8"><title>Overhead stylized before / after</title><style>body{margin:0;background:#181b1a;color:#e8e3d7;font:14px system-ui}h1{font-size:20px;margin:16px}main{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px}figure{margin:0;text-align:center;background:#080b0c}img{width:100%;height:330px;object-fit:contain}figcaption{height:25px}</style><h1>Before (authored assets) / After (stylized) — desktop pair / mobile pair</h1><main></main><script>for(const state of ['initial','shake','separation','pour','served','music'])for(const width of [1440,390])for(const before of [true,false]){const f=document.createElement('figure'),i=document.createElement('img'),c=document.createElement('figcaption');i.src=`${before?'../authored-assets/':''}${width}-${state}.png`;c.textContent=`${before?'BEFORE':'AFTER'} / ${width} / ${state}`;f.append(i,c);document.querySelector('main').append(f);}</script></html>
